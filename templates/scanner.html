<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ branch.name }} - Phone Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 15px; margin: 0; }
    #reader { max-width: 400px; margin: 15px auto; background: #fff; color: #000; border-radius: 10px; overflow: hidden; }
    .manual { max-width: 400px; margin: 15px auto; display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; }
    button { padding: 12px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; }
    #msg { margin-top: 12px; font-size: 16px; font-weight: bold; color: #4ade80; }
  </style>
</head>
<body>
  <h3>📱 {{ branch.name }} Scanner</h3>
  <div id="reader"></div>

  <div class="manual">
    <input type="text" id="manualCode" placeholder="ကုတ်ရိုက်ထည့်ရန် (P0001)">
    <button onclick="sendManual()">ပို့မည်</button>
  </div>
  <div id="msg">Scan ဖတ်ရန် အသင့်ဖြစ်ပါပြီ</div>

  <script>
    const BRANCH_CODE = "{{ branch.code }}";
    let lastCode = "";
    let lastTime = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type = "ok") {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = type === "ok" ? "sine" : "sawtooth";
      osc.frequency.setValueAtTime(type === "ok" ? 1200 : 300, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + (type === "ok" ? 0.12 : 0.25));
    }

    function postCode(code) {
      fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code, branch_code: BRANCH_CODE })
      })
      .then(r => r.json())
      .then(res => {
        const msg = document.getElementById("msg");
        if (res.status === "ok") {
          playBeep("ok");
          msg.style.color = "#4ade80";
          msg.innerText = `✅ ထည့်ပြီး: ${res.product.name} (${res.product.price} ကျပ်)`;
        } else {
          playBeep("err");
          msg.style.color = "#f87171";
          msg.innerText = `❌ ${res.message}`;
        }
      });
    }

    function sendManual() {
      const inp = document.getElementById("manualCode");
      if (!inp.value.trim()) return;
      postCode(inp.value.trim());
      inp.value = "";
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        const now = Date.now();
        if (decodedText === lastCode && now - lastTime < 1500) return;
        lastCode = decodedText;
        lastTime = now;
        postCode(decodedText.trim());
      }
    ).catch(err => {
      document.getElementById("msg").innerText = "ကင်မရာဖွင့်မရပါ - အောက်တွင် ကုတ်ရိုက်ထည့်နိုင်ပါသည်";
    });
  </script>
</body>
</html>
