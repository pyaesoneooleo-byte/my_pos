<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ branch.name }} - POS ကောင်တာ</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Segoe UI', Pyidaungsu, sans-serif; background: #f1f5f9; margin: 0; padding: 15px; }
    .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; }
    .nav-links a { color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 6px; font-size: 14px; font-weight: bold; margin-left: 6px; }
    .container { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; }
    @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
    .card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 15px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; }
    button { padding: 12px 18px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; width: 100%; font-size: 18px; padding: 14px; margin-top: 10px; }
    .btn-red { background: #dc2626; color: #fff; padding: 5px 10px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; }
    .total-box { font-size: 24px; font-weight: bold; color: #0f172a; text-align: right; margin-top: 15px; }
    .qr-box { text-align: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #cbd5e1; }
    .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
    .prod-btn {
      background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 10px; padding: 12px 10px;
      text-align: left; transition: 0.15s; color: #0f172a;
    }
    .prod-btn:hover { background: #eff6ff; border-color: #2563eb; transform: translateY(-2px); }
    .prod-btn .p-code { font-size: 12px; color: #2563eb; font-weight: bold; }
    .prod-btn .p-name { font-size: 15px; font-weight: bold; margin: 4px 0; }
    .prod-btn .p-meta { font-size: 13px; color: #475569; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

<div class="topbar">
  <div><strong>🏪 {{ branch.name }}</strong> | POS အရောင်းကောင်တာ</div>
  <div class="nav-links">
    <a href="/pos/{{ branch.code }}/reports" style="background:#0284c7;">📊 ဆိုင်ခွဲစာရင်းများ</a>
    <a href="/pos/{{ branch.code }}/logout" style="background:#dc2626;">🔒 Lock / ထွက်မည်</a>
  </div>
</div>

<div class="container">
  <div>
    <div class="card">
      <div class="input-row">
        <input type="text" id="codeInput" placeholder="ပစ္စည်းကုတ် ရိုက်ထည့်ပါ (ဥပမာ P0001)" autofocus>
        <button class="btn-blue" onclick="manualAdd()">ထည့်မည်</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ကုတ်</th>
            <th>ပစ္စည်းအမည်</th>
            <th>ဈေးနှုန်း</th>
            <th>အရေအတွက်</th>
            <th>သင့်ငွေ</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>

      <div class="total-box">စုစုပေါင်း: <span id="grandTotal">0</span> ကျပ်</div>
      <button class="btn-green" onclick="checkout()">ငွေရှင်းပြီး ဘောင်ချာထုတ်မည် (Print)</button>
    </div>

    <!-- Stock ရှိ ပစ္စည်းများ Click နှိပ်ရွေးချယ်ရန် -->
    <div class="card">
      <h4 style="margin:0 0 8px 0;">📦 {{ branch.name }} တွင် လက်ကျန်ရှိ ပစ္စည်းများ (Barcode မဖတ်ပါက နှိပ်၍ရွေးပါ)</h4>
      <div id="stockGrid" class="stock-grid"></div>
    </div>
  </div>

  <div class="card">
    <h4 style="margin-top:0;">📷 PC Webcam Scanner</h4>
    <div id="reader" style="width:100%;"></div>

    <div class="qr-box">
      <h4 style="margin:5px 0;">📱 ဖုန်းဖြင့် Scan ဖတ်ရန်</h4>
      <img src="{{ scanner_qr }}" alt="Scanner QR" style="width:150px; height:150px;">
      <div style="font-size:12px; color:#475569; word-break:break-all;">
        <a href="{{ scanner_url }}" target="_blank">{{ scanner_url }}</a>
      </div>
    </div>
  </div>
</div>

<script>
  const BRANCH_CODE = "{{ branch.code }}";
  const BRANCH_NAME = "{{ branch.name }}";
  let branchProducts = {{ products | tojson }};
  let cart = [];

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(type = "ok") {
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type === "ok" ? "sine" : "sawtooth";
    osc.frequency.setValueAtTime(type === "ok" ? 1200 : 300, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + (type === "ok" ? 0.12 : 0.25));
  }

  function renderStockGrid() {
    const grid = document.getElementById("stockGrid");
    const inStock = branchProducts.filter(p => p.stock > 0);
    if (inStock.length === 0) {
      grid.innerHTML = "<div style='color:#64748b; font-size:14px;'>လက်ကျန်ရှိ ပစ္စည်း မရှိသေးပါ</div>";
      return;
    }
    grid.innerHTML = inStock.map(p => `
      <button type="button" class="prod-btn" onclick="clickProduct('${p.code}')">
        <div class="p-code">${p.code}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-meta">
          <span>${Number(p.price).toLocaleString()} ကျပ်</span>
          <strong style="color:#16a34a;">ကျန်: ${p.stock}</strong>
        </div>
      </button>
    `).join("");
  }

  function clickProduct(code) {
    const prod = branchProducts.find(p => p.code === code);
    if (prod) addItemToCart(prod);
  }

  document.getElementById("codeInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") manualAdd();
  });

  function manualAdd() {
    const inp = document.getElementById("codeInput");
    const code = inp.value.trim();
    if (!code) return;
    inp.value = "";
    sendScanCode(code);
  }

  function sendScanCode(code) {
    fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, branch_code: BRANCH_CODE })
    })
    .then(r => r.json())
    .then(res => {
      if (res.status !== "ok") {
        playBeep("err");
        alert(res.message || "ပစ္စည်းမတွေ့ပါ");
      }
    });
  }

  function addItemToCart(prod) {
    const existing = cart.find(i => i.code === prod.code);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ code: prod.code, name: prod.name, price: prod.price, qty: 1 });
    }
    renderCart();
    playBeep("ok");
  }

  function changeQty(idx, delta) {
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    renderCart();
  }

  function removeItem(idx) {
    cart.splice(idx, 1);
    renderCart();
  }

  function renderCart() {
    const tbody = document.getElementById("cartBody");
    tbody.innerHTML = "";
    let total = 0;
    cart.forEach((item, idx) => {
      const sub = item.price * item.qty;
      total += sub;
      tbody.innerHTML += `
        <tr>
          <td>${item.code}</td>
          <td>${item.name}</td>
          <td>${item.price.toLocaleString()}</td>
          <td>
            <button onclick="changeQty(${idx}, -1)">-</button>
            <strong style="margin:0 8px;">${item.qty}</strong>
            <button onclick="changeQty(${idx}, 1)">+</button>
          </td>
          <td>${sub.toLocaleString()}</td>
          <td><button class="btn-red" onclick="removeItem(${idx})">ဖျက်</button></td>
        </tr>
      `;
    });
    document.getElementById("grandTotal").innerText = total.toLocaleString();
  }

  const evtSource = new EventSource(`/stream/${BRANCH_CODE}`);
  evtSource.onmessage = function(e) {
    const prod = JSON.parse(e.data);
    addItemToCart(prod);
  };

  function printReceipt(receiptNo, saleTime, items, grandTotal) {
    let rowsHtml = items.map(i => `
      <tr>
        <td style="padding:4px 0;">${i.name}<br><small>${i.code}</small></td>
        <td style="text-align:center;">${i.qty}</td>
        <td style="text-align:right;">${(i.price * i.qty).toLocaleString()}</td>
      </tr>
    `).join("");

    const win = window.open("", "_blank", "width=380,height=600");
    win.document.write(`
      <html><head><title>${receiptNo}</title>
      <style>
        body { font-family: 'Segoe UI', Pyidaungsu, sans-serif; width: 280px; margin: 0 auto; padding: 10px; font-size: 13px; color: #000; }
        h3, p { text-align: center; margin: 4px 0; }
        hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; }
        th { border-bottom: 1px dashed #000; padding-bottom: 4px; font-size: 12px; }
        .total { font-size: 16px; font-weight: bold; text-align: right; margin-top: 8px; }
      </style></head>
      <body onload="window.print(); setTimeout(() => window.close(), 500);">
        <h3>${BRANCH_NAME}</h3>
        <p>ဘောင်ချာ: ${receiptNo}</p>
        <p>အချိန်: ${saleTime}</p>
        <hr>
        <table>
          <thead>
            <tr>
              <th style="text-align:left;">ပစ္စည်း</th>
              <th style="text-align:center;">ခု</th>
              <th style="text-align:right;">သင့်ငွေ</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <hr>
        <div class="total">စုစုပေါင်း: ${grandTotal.toLocaleString()} ကျပ်</div>
        <hr>
        <p>ဝယ်ယူအားပေးမှုကို ကျေးဇူးတင်ပါသည်</p>
      </body></html>
    `);
    win.document.close();
  }

  function checkout() {
    if (cart.length === 0) return alert("ပစ္စည်းအရင်ထည့်ပါ");
    const soldItems = JSON.parse(JSON.stringify(cart));
    const totalAmt = soldItems.reduce((sum, i) => sum + (i.price * i.qty), 0);

    fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cart: soldItems, branch_code: BRANCH_CODE })
    })
    .then(r => r.json())
    .then(res => {
      if (res.status === "ok") {
        playBeep("ok");
        soldItems.forEach(s => {
          const bp = branchProducts.find(p => p.code === s.code);
          if (bp) bp.stock = Math.max(0, bp.stock - s.qty);
        });
        renderStockGrid();
        cart = [];
        renderCart();
        printReceipt(res.receipt_no, res.sale_time, soldItems, totalAmt);
      } else {
        playBeep("err");
        alert(res.message);
      }
    });
  }

  renderStockGrid();

  let lastScan = 0;
  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
  html5QrcodeScanner.render((decodedText) => {
    const now = Date.now();
    if (now - lastScan < 1500) return;
    lastScan = now;
    sendScanCode(decodedText.trim());
  });
</script>
</body>
</html>
